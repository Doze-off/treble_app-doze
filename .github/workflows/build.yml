name: Build TrebleApp

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Get source commit hash
        id: latest_commit
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Allow build script execution
        run: chmod +x build.sh

      - name: Build release APK
        run: |
          bash build.sh release

      - name: Verify APK
        run: |
          test -f TrebleApp.apk
          ls -lh TrebleApp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrebleApp
          path: TrebleApp.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TrebleApp.apk

          if git diff --cached --quiet; then
            echo "TrebleApp.apk não foi alterado; nenhum commit será criado."
            exit 0
          fi

          git commit -m "Update TrebleApp.apk (${{ steps.latest_commit.outputs.hash }}) [skip ci]"
          git push origin HEAD:master
